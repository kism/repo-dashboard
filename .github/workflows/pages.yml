---
name: Build Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *" # Badges are live images, this just picks up new/renamed repos.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the project
        run: uv sync

      - name: Build the page
        run: .venv/bin/repo-dashboard --user "${{ github.repository_owner }}" -vv
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
